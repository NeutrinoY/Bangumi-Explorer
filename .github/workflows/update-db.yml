name: Update Database

on:
  schedule:
    - cron: '0 0 * * *' # Daily at 00:00 UTC
  workflow_dispatch:

jobs:
  update-db:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Checkout Upstream Data
        uses: actions/checkout@v4
        with:
          repository: Jinrxin/bangumi-data
          path: upstream_data
          sparse-checkout: dist/subject
          sparse-checkout-cone-mode: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ETL
        env:
          SUBJECT_DIR: ${{ github.workspace }}/upstream_data/dist/subject
          OUTPUT_DIR: ${{ github.workspace }}/public/data
        run: pnpm data:merge

      - name: Commit Updated Database
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(data): update data artifacts from upstream [skip ci]"
          file_pattern: 'public/data/**'
